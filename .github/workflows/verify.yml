name: Verify erratum calculation
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.12'
      - run: sha256sum -c SHA256SUMS
      - run: julia --project=. test/runtests.jl
      - run: python3 scripts/export_erratum.py
      - run: git diff --exit-code -- results/paper_method_corrected docs/erratum_besii/support
